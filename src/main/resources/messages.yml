# Messages Configuration File (English)
# This file contains all user-facing messages. Other languages live in messages_<code>.yml;
# pick one with `language:` in config.yml. Keys missing from a translation fall back to this text.
# Color codes: &0-&9, &a-&f for colors, &l (bold), &n (underline), &o (italic), &k (magic), &m (strikethrough), &r (reset)
# Placeholders are marked with %placeholder_name%

# Core messages
prefix: "&8[&6Blackjack&8] &r"
no-permission: "&cYou don't have permission to do that!"
player-only-command: "&cThis command can only be used by players!"

# Table management
table-created: "&aBlackjack table created!"
table-created-with-settings: "&aTable #%id% created! &7(min: &e%min_bet%&7, max: &e%max_bet%&7, players: &e%max_players%&7, distance: &e%max_join_distance%&7)"
createtable-invalid-arg: "&cInvalid argument: %error%"
table-removed: "&cBlackjack table removed!"
table-already-exists: "&cTable already exists at this location!"
